dr_scenarios:
  -
    id: "DR-SCOPE-001"
    scope: "az"
    status: "proposed"
    rto_seconds: 0
    rpo_seconds: 0
    strategy_candidate: "Local HA only · broader DR not scoped"
    component_ids:
      - "NODE-D-OBS"
      - "NODE-D-TRAFFIC"
      - "NODE-D-APP"
      - "NODE-D-DB"
      - "NODE-D-BACKUP"
      - "NODE-D-RECAPP"
      - "NODE-D-RECDB"
      - "NODE-D-VERIFY"
    validation_tasks:
      - "Define recovery critical path: detection → failover authorization → data promotion/restore → app/IAM connectivity → routing → business verification."
      - "Demonstrate application-level recovery, data consistency, dependency reattachment, failback and split-brain protections."
      - "Document separate recovery objective for every in-scope failure scenario, including cyber/data corruption where relevant."
      - "Define end-user no-interruption test, routing convergence, fault injection and impaired-capacity measurement for RTO=0."
      - "Verify acknowledged-write zero-loss guarantee under partition and abruptly lost fault domain; document synchronous quorum vs write availability trade-off."
    notes: "No claim that selected pattern achieves RTO or RPO. Even confirmed input target is not a tested recovery result."
decisions:
  -
    id: "ADR-CAND-ARCH-01"
    topic: "Classification & hosting"
    candidate: "Route to GF-CL; migration is a separate overlay."
    status: "proposed"
    rationale: "change=greenfield; target=cloud — Route to GF-CL; migration is a separate overlay."
    rule_ids:
      - "ARCH-01"
    requirement_ids:
      - "REQ-PLAT-001"
      - "REQ-PLAT-002"
    alternatives:
