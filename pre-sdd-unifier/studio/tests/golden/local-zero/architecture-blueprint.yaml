    summary: "Active-active application · multi-zone (DR scope may be open) candidate, Relational transactional store. RTO 0 s; RPO 0 s; scope az. Serving application capacity is proposed across failure domains; this is not proof of an uninterrupted service or multiple safe DB writers. All nodes and links are proposed logical candidates, not verified deployment facts. Source of product use cases remains the BRD. Required validation: Confirm region/site and actual fault-domain independence; do not infer region or zone availability. | Benchmark compute and data tier throughput under peak and impaired-zone load. | Confirm database durability, failover behavior, backups, IAM, monitoring, and provider eligibility. | Zero-second RTO requires an explicit user-facing outage measurement and fault-injection evidence; continuously serving applications alone do not prove this target. | Zero-second RPO requires tested committed-write acknowledgement and quorum/replication semantics; evaluate latency, partition behavior and the risk of unavailable writes."
