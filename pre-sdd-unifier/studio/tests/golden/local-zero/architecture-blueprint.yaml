calculations:
  -
    id: "CALC-01"
    rule_id: "CALC-01"
    rule_version: "2.2"
    formula: "daily_transactions / 86400"
    substitution: "1,000,000 / 86400"
    input_requirement_ids:
      - "REQ-CAP-001"
    output:
      value: 11.574074074074074
      unit: "txn/s"
    status: "estimated"
    limitations: "Daily average is not peak or burst demand."
  -
    id: "CALC-02"
    rule_id: "CALC-02"
    rule_version: "2.2"
    formula: "average_TPS × peak_factor"
    substitution: "11.574 × 5"
    input_requirement_ids:
      - "REQ-CAP-001"
      - "REQ-CAP-002"
    output:
      value: 57.870370370370374
      unit: "txn/s"
    status: "estimated"
    limitations: "Peak multiplier requires measured demand curve or agreed forecast."
  -
    id: "CALC-03"
    rule_id: "CALC-03"
    rule_version: "2.2"
    formula: "peak_TPS × calls_per_txn × request_amplification"
    substitution: "57.87 × 3 × 1.1"
    input_requirement_ids:
      - "REQ-CAP-001"
      - "REQ-CAP-002"
    output:
      value: 190.97222222222223
      unit: "req/s"
    status: "estimated"
    limitations: "API calls, event fanout and retries must not be double-counted."
  -
    id: "CALC-04"
    rule_id: "CALC-04"
    rule_version: "2.2"
    formula: "peak_API_RPS / utilization_fraction"
    substitution: "190.972 / 0.65"
    input_requirement_ids:
      - "REQ-CAP-001"
      - "REQ-PERF-001"
    output:
      value: 293.8034188034188
      unit: "req/s"
    status: "estimated"
    limitations: "Throughput envelope, not number of nodes. Requires P99 load tests."
  -
    id: "CALC-05"
    rule_id: "CALC-05"
    rule_version: "2.2"
    formula: "peak_API_RPS × mean_latency_ms / 1000"
    substitution: "190.972 × 120 / 1000"
    input_requirement_ids:
      - "REQ-PERF-001"
    output:
      value: 22.916666666666668
      unit: "requests"
    status: "estimated"
    limitations: "Little’s Law uses mean latency, not P99 or logged-in users."
  -
    id: "CALC-06"
    rule_id: "CALC-06"
    rule_version: "2.2"
    formula: "peak_RPS × request_KB × 8 / 1000 × overhead"
    substitution: "190.972 × 4 × 8 / 1000 × 1.2"
    input_requirement_ids:
      - "REQ-CAP-001"
      - "REQ-NET-001"
    output:
      value: 7.333333333333334
      unit: "Mbps"
    status: "estimated"
    limitations: "One selected network boundary; excludes replication/east-west flows."
  -
    id: "CALC-07"
    rule_id: "CALC-07"
    rule_version: "2.2"
    formula: "peak_RPS × response_KB × 8 / 1000 × overhead"
    substitution: "190.972 × 16 × 8 / 1000 × 1.2"
    input_requirement_ids:
      - "REQ-CAP-001"
      - "REQ-NET-001"
    output:
      value: 29.333333333333336
      unit: "Mbps"
    status: "estimated"
    limitations: "Directional egress is not a separate guaranteed link rating."
  -
    id: "CALC-08"
    rule_id: "CALC-08"
    rule_version: "2.2"
    formula: "inbound_Mbps + outbound_Mbps"
    substitution: "7.333 + 29.333"
    input_requirement_ids:
      - "REQ-NET-001"
    output:
      value: 36.66666666666667
      unit: "Mbps"
    status: "estimated"
    limitations: "Sum of directional traffic; not a physical link-speed requirement."
  -
    id: "CALC-09"
    rule_id: "CALC-09"
    rule_version: "2.2"
    formula: "avg_API_RPS × 86400 × (request_KB + response_KB) / 1e6"
    substitution: "38.194 × 86400 × (4 + 16) / 1e6"
    input_requirement_ids:
      - "REQ-CAP-001"
    output:
      value: 66
      unit: "GB/day"
    status: "estimated"
    limitations: "Decimal GB; excludes internal and replication traffic."
  -
    id: "CALC-10"
    rule_id: "CALC-10"
    rule_version: "2.2"
    formula: "daily_txn × stored_KB_per_txn / 1e6"
    substitution: "1,000,000 × 2 / 1e6"
    input_requirement_ids:
      - "REQ-DAT-001"
    output:
      value: 2
      unit: "GB/day"
    status: "estimated"
    limitations: "Assumes every transaction contributes its stated logical size."
  -
    id: "CALC-11"
    rule_id: "CALC-11"
    rule_version: "2.2"
    formula: "starting_GB + daily_new_GB × retention_days"
    substitution: "0 + 2 × 365"
    input_requirement_ids:
      - "REQ-DAT-001"
    output:
      value: 730
      unit: "GB"
    status: "estimated"
    limitations: "Steady-state simplified model; excludes historical growth and erasure."
  -
    id: "CALC-12"
    rule_id: "CALC-12"
    rule_version: "2.2"
    formula: "logical_GB × index_factor × modeled_copies"
    substitution: "730 × 1.4 × 2"
    input_requirement_ids:
      - "REQ-DAT-001"
    output:
      value: 2043.9999999999998
      unit: "GB"
    status: "estimated"
    limitations: "Provider redundancy, snapshots, WAL, logs and backups are not fully modeled."
  -
    id: "CALC-13"
    rule_id: "CALC-13"
    rule_version: "2.2"
    formula: "(1 − availability_pct/100) × 30 × 86400"
    substitution: "(1 − 99.9 / 100) × 2592000"
    input_requirement_ids:
      - "REQ-REL-001"
    output:
      value: 2591.9999999997144
      unit: "s"
    status: "estimated"
    limitations: "Calendar-time assumption; SLA exclusions may differ."
  -
    id: "CALC-14"
    rule_id: "CALC-14"
    rule_version: "2.2"
    formula: "(1 − availability_pct/100) × 365 × 86400"
    substitution: "(1 − 99.9 / 100) × 31536000"
    input_requirement_ids:
      - "REQ-REL-001"
    output:
      value: 31535.999999996526
      unit: "s"
    status: "estimated"
    limitations: "SLO downtime budget is not an outage-specific RTO."
  -
    id: "CALC-15"
    rule_id: "CALC-15"
    rule_version: "2.2"
    formula: "peak_TPS × RPO_seconds"
    substitution: "57.87 × 0"
    input_requirement_ids:
      - "REQ-DR-002"
      - "REQ-CAP-001"
    output:
      value: 0
      unit: "txns"
    status: "estimated"
    limitations: "Potential exposure if peak persisted; not the number of lost committed writes."
  -
    id: "CALC-16"
    rule_id: "CALC-16"
    rule_version: "2.2"
    formula: "peak_RPS × (1 + growth_pct/100)"
    substitution: "190.972 × (1 + 35 / 100)"
    input_requirement_ids:
      - "REQ-CAP-003"
    output:
      value: 257.8125
      unit: "req/s"
    status: "estimated"
    limitations: "Simple uniform growth scenario; not an adopted business forecast."
