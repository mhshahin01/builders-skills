      status: "proposed"
      requirement_ids:
        - "REQ-DR-001"
        - "REQ-DR-002"
        - "REQ-DR-003"
      rationale: "AWS DR ladder taxonomy applied provider-neutrally; no recovery guarantee."
    -
      id: "PAT-DATA-001"
      name: "Relational transactional store"
      status: "proposed"
      requirement_ids:
