        name: "Alternative requires trade-off review"
        tradeoff: "Check zone support, shared dependencies, measured failover and supported availability."
    owner: "Not assigned"
    open_validation:
      - "Check zone support, shared dependencies, measured failover and supported availability."
  -
    id: "ADR-CAND-CAP-04"
    topic: "Workload-based capacity planning"
    candidate: "Size and benchmark at sustained peak with headroom and failure-mode capacity."
    status: "proposed"
    rationale: "peak=57.87 TPS; 190.97 API RPS — Size and benchmark at sustained peak with headroom and failure-mode capacity."
    rule_ids:
      - "CAP-04"
    requirement_ids:
      - "REQ-CAP-001"
      - "REQ-CAP-002"
    alternatives:
      -
        name: "Alternative requires trade-off review"
        tradeoff: "Obtain peak duration, load profile, per-instance P99 throughput, storage IOPS and growth."
    owner: "Not assigned"
    open_validation:
      - "Obtain peak duration, load profile, per-instance P99 throughput, storage IOPS and growth."
  -
    id: "ADR-CAND-DR-06"
    topic: "Extremely short recovery objective"
    candidate: "Explore automated detection/traffic switch and pre-provisioned recovery; do not promise objective."
    status: "proposed"
    rationale: "RTO=0 s for az — Explore automated detection/traffic switch and pre-provisioned recovery; do not promise objective."
    rule_ids:
      - "DR-06"
    requirement_ids:
      - "REQ-DR-001"
      - "REQ-DR-003"
    alternatives:
      -
        name: "Alternative requires trade-off review"
        tradeoff: "Measure recovery critical path and failback in destructive tests."
    owner: "Not assigned"
    open_validation:
      - "Measure recovery critical path and failback in destructive tests."
  -
    id: "ADR-CAND-DR-ZERO-01"
    topic: "Zero interruption target: continuous serving required"
    candidate: "Show active-serving application capacity in independent fault domains for study. A drawn active-active topology is not proof of no interruption; data writes and external dependencies need separate protection."
    status: "proposed"
    rationale: "RTO=0 s; failure scope=az — Show active-serving application capacity in independent fault domains for study. A drawn active-active topology is not proof of no interruption; data writes and external dependencies need separate protection."
    rule_ids:
      - "DR-ZERO-01"
    requirement_ids:
      - "REQ-DR-001"
      - "REQ-DR-003"
    alternatives:
      -
        name: "Alternative requires trade-off review"
        tradeoff: "Define end-user interruption measurement, run disruptive failover/partition tests, and verify DNS, capacity, identity and SLI results."
    owner: "Not assigned"
    open_validation:
      - "Define end-user interruption measurement, run disruptive failover/partition tests, and verify DNS, capacity, identity and SLI results."
  -
    id: "ADR-CAND-DR-ZERO-02"
    topic: "Zero loss + no interruption: correctness/availability trade-off"
    candidate: "Explore quorum or synchronous commit where feasible, including potential write unavailability and latency under partition. Dual serving application tiers do NOT imply safe multi-writer databases."
    status: "proposed"
    rationale: "RTO=0 s; RPO=0 s; consistency=strong — Explore quorum or synchronous commit where feasible, including potential write unavailability and latency under partition. Dual serving application tiers do NOT imply safe multi-writer databases."
    rule_ids:
      - "DR-ZERO-02"
    requirement_ids:
      - "REQ-DR-001"
      - "REQ-DR-002"
      - "REQ-DAT-002"
    alternatives:
      -
        name: "Alternative requires trade-off review"
        tradeoff: "Verify acknowledged-write durability, partition behavior, commit latency, fencing, failback and end-to-end service recovery."
    owner: "Not assigned"
    open_validation:
      - "Verify acknowledged-write durability, partition behavior, commit latency, fencing, failback and end-to-end service recovery."
  -
    id: "ADR-CAND-DATA-07"
    topic: "Zero acknowledged-write loss objective"
    candidate: "Asynchronous cross-region replicas alone do not prove zero-loss durability. Assess partitions, write acknowledgements and quorum/commit semantics."
    status: "proposed"
    rationale: "RPO=0 seconds — Asynchronous cross-region replicas alone do not prove zero-loss durability. Assess partitions, write acknowledgements and quorum/commit semantics."
