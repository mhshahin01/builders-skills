        name: "Alternative requires trade-off review"
        tradeoff: "Confirm target-hosting responsibility and hard platform restrictions."
    owner: "Not assigned"
    open_validation:
      - "Confirm target-hosting responsibility and hard platform restrictions."
  -
    id: "ADR-CAND-HA-02"
    topic: "Multi-zone availability candidate"
    candidate: "Use independent failure zones and avoid shared single points where feasible. This is HA, not proof of region DR."
    status: "proposed"
    rationale: "fault=az, availability=99.9% — Use independent failure zones and avoid shared single points where feasible. This is HA, not proof of region DR."
    rule_ids:
      - "HA-02"
    requirement_ids:
      - "REQ-REL-001"
      - "REQ-DR-003"
    alternatives:
